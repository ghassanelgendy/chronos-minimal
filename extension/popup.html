<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 220px;
      padding: 12px;
      margin: 0;
      background: #1e1e2e;
      color: #cdd6f4;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #89b4fa;
    }
    .status {
      padding: 6px 8px;
      border-radius: 6px;
      background: #313244;
      color: #a6e3a1;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>⏱ Chronos Screentime</span>
  </div>
  <div>Connected to local app</div>
  <div class="status" id="status">Active & Syncing</div>
</body>
</html>
