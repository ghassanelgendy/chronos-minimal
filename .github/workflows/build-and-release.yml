name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package Linux release
        run: |
          mkdir -p staging/chronos-screentime
          cp target/release/chronos-screentime staging/chronos-screentime/
          cp icon-9.png staging/chronos-screentime/
          cp install.sh staging/chronos-screentime/ 2>/dev/null || true
          cp uninstall.sh staging/chronos-screentime/ 2>/dev/null || true
          cp README.md staging/chronos-screentime/ 2>/dev/null || true
          cd staging
          tar -czvf ../chronos-screentime-linux-x86_64.tar.gz chronos-screentime

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-screentime-linux-x86_64
          path: chronos-screentime-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/chronos-screentime
          Copy-Item target/release/chronos-screentime.exe staging/chronos-screentime/
          Copy-Item icon.ico staging/chronos-screentime/ -ErrorAction SilentlyContinue
          Copy-Item icon-9.png staging/chronos-screentime/ -ErrorAction SilentlyContinue
          Copy-Item README.md staging/chronos-screentime/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/chronos-screentime -DestinationPath chronos-screentime-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronos-screentime-windows-x86_64
          path: chronos-screentime-windows-x86_64.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: chronos-screentime-linux-x86_64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: chronos-screentime-windows-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chronos-screentime-linux-x86_64.tar.gz
            chronos-screentime-windows-x86_64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
